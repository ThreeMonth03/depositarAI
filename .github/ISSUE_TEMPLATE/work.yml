name: Work item
description: Report a bug, propose a change, or define a linked sub-issue.
body:
  - type: markdown
    attributes:
      value: |
        Show the behavior with a small example, reproduction, diagram or sanitized screenshot.
        Read [Contributing](https://github.com/ThreeMonth03/depositarAI/blob/main/CONTRIBUTING.md).
        For sensitive vulnerabilities use the [security policy](https://github.com/ThreeMonth03/depositarAI/blob/main/SECURITY.md), not a public report.
  - type: dropdown
    id: kind
    attributes:
      label: Work type
      options:
        - Bug
        - Change
        - Sub-issue
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: Sub-issues must link their parent. Use None for a top-level Issue.
      placeholder: "#123 or None"
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Who needs this outcome, and why?
      placeholder: One or two sentences explaining the problem or benefit.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example / bug reproduction
      description: Show a minimal example. For bugs include steps and actual behavior. Prefer fenced code, diagrams, diffs or sanitized images.
      placeholder: "Input or steps → actual behavior. Use synthetic data and a new session when relevant."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: Show the expected output or before/after behavior.
      placeholder: A small JSON response, diff, diagram or screenshot makes the target concrete.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and coordination
      description: Record the owner, writes, shared interfaces, dependencies and resource needs before implementation. Unknowns can stay explicit while drafting.
      placeholder: |
        Owner:
        Writes:
        Interface:
        Depends on:
        Resources: CPU / shared inference / catalog state / deployment
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State observable outcomes, how they will be checked, and what is outside this Issue.
      placeholder: |
        - [ ] AC-1: ...
        - [ ] AC-2: ...
        Out of scope: ...
    validations:
      required: true
