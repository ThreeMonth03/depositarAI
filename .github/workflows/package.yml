name: Source package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact package revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified Docker Compose
        run: bash scripts/ci/install-compose.sh
      - name: Validate search, API and runtime packages
        run: make search-ci

  private-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact package revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified Docker Compose
        run: bash scripts/ci/install-compose.sh
      - name: Unit, TypeScript, build and real HTTP browser tests
        run: bash scripts/test-search-web.sh

  package:
    needs: [validate, private-website]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out selected revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install and self-test the verified secret scanner
        run: bash scripts/ci/install-gitleaks.sh
      - name: Scan selected history and package tracked source only
        run: |
          bash scripts/ci/source-package.sh \
            "$RUNNER_TEMP/depositar-ai-release" "$GITHUB_SHA" "$GITLEAKS_BINARY"
      - name: Verify digests, exact Git restore and CLI help without Docker
        run: |
          bash scripts/ci/source-restore.sh \
            "$RUNNER_TEMP/depositar-ai-release" "$GITHUB_SHA" \
            "$RUNNER_TEMP/depositar-ai-source-restore"
      - name: Keep source-only artifact (no runtime data, registry or release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: depositar-ai-source-${{ github.sha }}
          path: ${{ runner.temp }}/depositar-ai-release/
          retention-days: 7
          if-no-files-found: error
