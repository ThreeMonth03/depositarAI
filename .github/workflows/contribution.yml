name: Contribution

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: contribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    name: Check work description
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out source without stored credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test bounded metadata validation
        run: python3 -B -m unittest tests.unit.deployment.test_contribution
      - name: Check PR description
        run: python3 -I -S -B scripts/ci/contribution.py
