name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact lint source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install only the locked Python lint tools
        run: |
          python3 -m venv "$RUNNER_TEMP/depositar-lint"
          PATH="$RUNNER_TEMP/depositar-lint/bin:$PATH" \
            bash scripts/ci/python-lint.sh install
      - name: Validate lint tooling behavior
        run: |
          PATH="$RUNNER_TEMP/depositar-lint/bin:$PATH" \
            python3 -B -m unittest \
              tests.unit.deployment.test_python_lint_gate tests.test_complexity -v
      - name: Check Python style and unused code
        env:
          COMPLEXITY_REPORT: ${{ runner.temp }}/depositar-complexity.json
        run: |
          PATH="$RUNNER_TEMP/depositar-lint/bin:$PATH" make lint
      - name: Retain native whole-project complexity findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-complexity-${{ github.sha }}
          path: ${{ runner.temp }}/depositar-complexity.json
          if-no-files-found: ignore
          retention-days: 7

  core-source:
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_tree: ${{ steps.source.outputs.tree }}
      gate_outcome: ${{ steps.scan.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Record actual checkout
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$GITHUB_SHA" ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\ntree=%s\n' "$source_sha" "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'CI_SOURCE sha=%s tree=%s\n' "$source_sha" "$source_tree"

      - name: Install and self-test the verified secret scanner
        run: bash scripts/ci/install-gitleaks.sh

      - name: Scan selected history and verify source packaging
        id: scan
        run: |
          bash scripts/ci/source-package.sh \
            "$RUNNER_TEMP/depositar-source-check" "$GITHUB_SHA" "$GITLEAKS_BINARY"

  core-host:
    needs: [core-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_tree: ${{ steps.source.outputs.tree }}
      gate_outcome: ${{ steps.check.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require checked source before product checks
        id: source
        env:
          SOURCE_GATE_OUTCOME: ${{ needs.core-source.outputs.gate_outcome }}
          EXPECTED_SHA: ${{ needs.core-source.outputs.source_sha }}
          EXPECTED_TREE: ${{ needs.core-source.outputs.source_tree }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$GITHUB_SHA" ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_GATE_OUTCOME" == success ]]
          [[ "$source_sha" == "$EXPECTED_SHA" && "$source_tree" == "$EXPECTED_TREE" ]]
          printf 'sha=%s\ntree=%s\n' "$source_sha" "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'CI_SOURCE sha=%s tree=%s\n' "$source_sha" "$source_tree"
      - name: Install verified Docker Compose
        run: bash scripts/ci/install-compose.sh
      - name: Run host checks
        id: check
        run: bash scripts/search-ci.sh --phase host

  core-api:
    needs: [core-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_tree: ${{ steps.source.outputs.tree }}
      gate_outcome: ${{ steps.check.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require checked source before product checks
        id: source
        env:
          SOURCE_GATE_OUTCOME: ${{ needs.core-source.outputs.gate_outcome }}
          EXPECTED_SHA: ${{ needs.core-source.outputs.source_sha }}
          EXPECTED_TREE: ${{ needs.core-source.outputs.source_tree }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$GITHUB_SHA" ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_GATE_OUTCOME" == success ]]
          [[ "$source_sha" == "$EXPECTED_SHA" && "$source_tree" == "$EXPECTED_TREE" ]]
          printf 'sha=%s\ntree=%s\n' "$source_sha" "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'CI_SOURCE sha=%s tree=%s\n' "$source_sha" "$source_tree"
      - name: Install verified Docker Compose
        run: bash scripts/ci/install-compose.sh
      - name: Run api checks
        id: check
        run: bash scripts/search-ci.sh --phase api

  validate:
    needs: [lint, core-source, core-host, core-api]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require successful core jobs
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SOURCE_RESULT: ${{ needs.core-source.result }}
          HOST_RESULT: ${{ needs.core-host.result }}
          API_RESULT: ${{ needs.core-api.result }}
        run: |
          set -euo pipefail
          test "$LINT_RESULT" = success
          test "$SOURCE_RESULT" = success
          test "$HOST_RESULT" = success
          test "$API_RESULT" = success
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record actual checkout
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$GITHUB_SHA" ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\ntree=%s\n' "$source_sha" "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'CI_SOURCE sha=%s tree=%s\n' "$source_sha" "$source_tree"
      - name: Require all core checks and matching source evidence
        env:
          SOURCE_GATE_OUTCOME: ${{ needs.core-source.outputs.gate_outcome }}
          SOURCE_SOURCE_SHA: ${{ needs.core-source.outputs.source_sha }}
          SOURCE_SOURCE_TREE: ${{ needs.core-source.outputs.source_tree }}
          HOST_GATE_OUTCOME: ${{ needs.core-host.outputs.gate_outcome }}
          HOST_SOURCE_SHA: ${{ needs.core-host.outputs.source_sha }}
          HOST_SOURCE_TREE: ${{ needs.core-host.outputs.source_tree }}
          API_GATE_OUTCOME: ${{ needs.core-api.outputs.gate_outcome }}
          API_SOURCE_SHA: ${{ needs.core-api.outputs.source_sha }}
          API_SOURCE_TREE: ${{ needs.core-api.outputs.source_tree }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_GATE_OUTCOME" == success && "$HOST_GATE_OUTCOME" == success && "$API_GATE_OUTCOME" == success ]]
          [[ "$SOURCE_SOURCE_SHA" == "$GITHUB_SHA" && "$HOST_SOURCE_SHA" == "$GITHUB_SHA" && "$API_SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$SOURCE_SOURCE_TREE" == "$EXPECTED_TREE" && "$HOST_SOURCE_TREE" == "$EXPECTED_TREE" && "$API_SOURCE_TREE" == "$EXPECTED_TREE" ]]
          echo 'All core checks passed on the exact workflow source.'
      - name: Reject cancelled workflow
        if: cancelled()
        run: exit 1

  private-website-oss-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      scope_run: ${{ steps.scope.outputs.run }}
      gate_outcome: ${{ steps.website.outcome }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_tree: ${{ steps.source.outputs.tree }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record actual checkout
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$GITHUB_SHA" ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\ntree=%s\n' "$source_sha" "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'CI_SOURCE sha=%s tree=%s\n' "$source_sha" "$source_tree"
      - name: Select affected specialist gate
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci/changed-scope.py private-website >> "$GITHUB_OUTPUT"
      - name: Install verified Docker Compose
        if: steps.scope.outputs.run != 'false'
        run: bash scripts/ci/install-compose.sh
      - name: Restore npm downloads
        id: npm-cache
        if: steps.scope.outputs.run != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/depositar-npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-web-npm-node24-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-web-npm-node24-
      - name: Unit, TypeScript, build and OSS policy runtime tests
        id: website
        if: steps.scope.outputs.run != 'false'
        env:
          CI_NPM_CACHE: ${{ runner.temp }}/depositar-npm
        run: bash scripts/test-search-web.sh --suite oss-policy
      - name: Save npm downloads
        if: >-
          success() && steps.scope.outputs.run != 'false' &&
          steps.npm-cache.outputs.cache-hit != 'true' &&
          steps.npm-cache.outputs.cache-primary-key != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/depositar-npm/_cacache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Report unaffected gate
        if: steps.scope.outputs.run == 'false'
        run: echo 'No website dependency changed; the full validate gate still runs.'

  private-website-oss-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      scope_run: ${{ steps.scope.outputs.run }}
      gate_outcome: ${{ steps.website.outcome }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_tree: ${{ steps.source.outputs.tree }}
      shard_id: ${{ steps.source.outputs.shard_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record actual checkout
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$GITHUB_SHA" ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\ntree=%s\nshard_id=a\n' "$source_sha" "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'CI_SOURCE sha=%s tree=%s\n' "$source_sha" "$source_tree"
      - name: Select affected specialist gate
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci/changed-scope.py private-website >> "$GITHUB_OUTPUT"
      - name: Install verified Docker Compose
        if: steps.scope.outputs.run != 'false'
        run: bash scripts/ci/install-compose.sh
      - name: Restore npm downloads
        id: npm-cache
        if: steps.scope.outputs.run != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/depositar-npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-web-npm-node24-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-web-npm-node24-
      - name: Unit, TypeScript, build and OSS gateway shard A runtime tests
        id: website
        if: steps.scope.outputs.run != 'false'
        env:
          CI_NPM_CACHE: ${{ runner.temp }}/depositar-npm
        run: bash scripts/test-search-web.sh --suite oss-gateway-a
      - name: Save npm downloads
        if: >-
          success() && steps.scope.outputs.run != 'false' &&
          steps.npm-cache.outputs.cache-hit != 'true' &&
          steps.npm-cache.outputs.cache-primary-key != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/depositar-npm/_cacache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Report unaffected gate
        if: steps.scope.outputs.run == 'false'
        run: echo 'No website dependency changed; the full validate gate still runs.'

  private-website-oss-gateway-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      scope_run: ${{ steps.scope.outputs.run }}
      gate_outcome: ${{ steps.website.outcome }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_tree: ${{ steps.source.outputs.tree }}
      shard_id: ${{ steps.source.outputs.shard_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record actual checkout
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$GITHUB_SHA" ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\ntree=%s\nshard_id=b\n' "$source_sha" "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'CI_SOURCE sha=%s tree=%s\n' "$source_sha" "$source_tree"
      - name: Select affected specialist gate
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci/changed-scope.py private-website >> "$GITHUB_OUTPUT"
      - name: Install verified Docker Compose
        if: steps.scope.outputs.run != 'false'
        run: bash scripts/ci/install-compose.sh
      - name: Restore npm downloads
        id: npm-cache
        if: steps.scope.outputs.run != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/depositar-npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-web-npm-node24-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-web-npm-node24-
      - name: Unit, TypeScript, build and OSS gateway shard B runtime tests
        id: website
        if: steps.scope.outputs.run != 'false'
        env:
          CI_NPM_CACHE: ${{ runner.temp }}/depositar-npm
        run: bash scripts/test-search-web.sh --suite oss-gateway-b
      - name: Save npm downloads
        if: >-
          success() && steps.scope.outputs.run != 'false' &&
          steps.npm-cache.outputs.cache-hit != 'true' &&
          steps.npm-cache.outputs.cache-primary-key != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/depositar-npm/_cacache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Report unaffected gate
        if: steps.scope.outputs.run == 'false'
        run: echo 'No website dependency changed; the full validate gate still runs.'

  private-website-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      scope_run: ${{ steps.scope.outputs.run }}
      gate_outcome: ${{ steps.website.outcome }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_tree: ${{ steps.source.outputs.tree }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record actual checkout
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$GITHUB_SHA" ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\ntree=%s\n' "$source_sha" "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'CI_SOURCE sha=%s tree=%s\n' "$source_sha" "$source_tree"
      - name: Select affected specialist gate
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci/changed-scope.py private-website >> "$GITHUB_OUTPUT"
      - name: Install verified Docker Compose
        if: steps.scope.outputs.run != 'false'
        run: bash scripts/ci/install-compose.sh
      - name: Restore npm downloads
        id: npm-cache
        if: steps.scope.outputs.run != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/depositar-npm/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-web-npm-node24-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-web-npm-node24-
      - name: Unit, TypeScript, build and real HTTP browser tests
        id: website
        if: steps.scope.outputs.run != 'false'
        env:
          CI_NPM_CACHE: ${{ runner.temp }}/depositar-npm
        run: bash scripts/test-search-web.sh --suite browser
      - name: Save npm downloads
        if: >-
          success() && steps.scope.outputs.run != 'false' &&
          steps.npm-cache.outputs.cache-hit != 'true' &&
          steps.npm-cache.outputs.cache-primary-key != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/depositar-npm/_cacache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - name: Report unaffected gate
        if: steps.scope.outputs.run == 'false'
        run: echo 'No website dependency changed; the full validate gate still runs.'

  private-website:
    needs: [private-website-oss-policy, private-website-oss-gateway, private-website-oss-gateway-b, private-website-browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Record actual checkout
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$source_sha" == "$GITHUB_SHA" ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\ntree=%s\n' "$source_sha" "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'CI_SOURCE sha=%s tree=%s\n' "$source_sha" "$source_tree"
      - name: Require all website suites and matching source evidence
        id: aggregate
        if: always() && !cancelled()
        env:
          OSS_POLICY_RESULT: ${{ needs.private-website-oss-policy.result }}
          OSS_GATEWAY_RESULT: ${{ needs.private-website-oss-gateway.result }}
          OSS_GATEWAY_B_RESULT: ${{ needs.private-website-oss-gateway-b.result }}
          BROWSER_RESULT: ${{ needs.private-website-browser.result }}
          OSS_POLICY_SCOPE_RUN: ${{ needs.private-website-oss-policy.outputs.scope_run }}
          OSS_GATEWAY_SCOPE_RUN: ${{ needs.private-website-oss-gateway.outputs.scope_run }}
          OSS_GATEWAY_B_SCOPE_RUN: ${{ needs.private-website-oss-gateway-b.outputs.scope_run }}
          BROWSER_SCOPE_RUN: ${{ needs.private-website-browser.outputs.scope_run }}
          OSS_POLICY_GATE_OUTCOME: ${{ needs.private-website-oss-policy.outputs.gate_outcome }}
          OSS_GATEWAY_GATE_OUTCOME: ${{ needs.private-website-oss-gateway.outputs.gate_outcome }}
          OSS_GATEWAY_B_GATE_OUTCOME: ${{ needs.private-website-oss-gateway-b.outputs.gate_outcome }}
          BROWSER_GATE_OUTCOME: ${{ needs.private-website-browser.outputs.gate_outcome }}
          OSS_POLICY_SOURCE_SHA: ${{ needs.private-website-oss-policy.outputs.source_sha }}
          OSS_GATEWAY_SOURCE_SHA: ${{ needs.private-website-oss-gateway.outputs.source_sha }}
          OSS_GATEWAY_B_SOURCE_SHA: ${{ needs.private-website-oss-gateway-b.outputs.source_sha }}
          BROWSER_SOURCE_SHA: ${{ needs.private-website-browser.outputs.source_sha }}
          OSS_POLICY_SOURCE_TREE: ${{ needs.private-website-oss-policy.outputs.source_tree }}
          OSS_GATEWAY_SOURCE_TREE: ${{ needs.private-website-oss-gateway.outputs.source_tree }}
          OSS_GATEWAY_B_SOURCE_TREE: ${{ needs.private-website-oss-gateway-b.outputs.source_tree }}
          BROWSER_SOURCE_TREE: ${{ needs.private-website-browser.outputs.source_tree }}
          OSS_GATEWAY_SHARD_ID: ${{ needs.private-website-oss-gateway.outputs.shard_id }}
          OSS_GATEWAY_B_SHARD_ID: ${{ needs.private-website-oss-gateway-b.outputs.shard_id }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          [[ "$OSS_POLICY_RESULT" == success && "$OSS_GATEWAY_RESULT" == success && "$OSS_GATEWAY_B_RESULT" == success && "$BROWSER_RESULT" == success ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$OSS_POLICY_SOURCE_SHA" == "$GITHUB_SHA" && "$OSS_GATEWAY_SOURCE_SHA" == "$GITHUB_SHA" && "$OSS_GATEWAY_B_SOURCE_SHA" == "$GITHUB_SHA" && "$BROWSER_SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OSS_POLICY_SOURCE_TREE" == "$EXPECTED_TREE" && "$OSS_GATEWAY_SOURCE_TREE" == "$EXPECTED_TREE" && "$OSS_GATEWAY_B_SOURCE_TREE" == "$EXPECTED_TREE" && "$BROWSER_SOURCE_TREE" == "$EXPECTED_TREE" ]]
          [[ "$OSS_GATEWAY_SHARD_ID" == a && "$OSS_GATEWAY_B_SHARD_ID" == b ]]
          case "$OSS_POLICY_SCOPE_RUN:$OSS_GATEWAY_SCOPE_RUN:$OSS_GATEWAY_B_SCOPE_RUN:$BROWSER_SCOPE_RUN" in
            true:true:true:true)
              [[ "$OSS_POLICY_GATE_OUTCOME" == success && "$OSS_GATEWAY_GATE_OUTCOME" == success && "$OSS_GATEWAY_B_GATE_OUTCOME" == success && "$BROWSER_GATE_OUTCOME" == success ]]
              echo 'All website suites passed on the exact workflow source.'
              ;;
            false:false:false:false)
              [[ "$GITHUB_EVENT_NAME" == pull_request ]]
              [[ "$OSS_POLICY_GATE_OUTCOME" == skipped && "$OSS_GATEWAY_GATE_OUTCOME" == skipped && "$OSS_GATEWAY_B_GATE_OUTCOME" == skipped && "$BROWSER_GATE_OUTCOME" == skipped ]]
              echo 'Confirmed unaffected website suites; the full validate gate still runs.'
              ;;
            *)
              echo 'Website scope evidence is missing or inconsistent.' >&2
              exit 1
              ;;
          esac
      - name: Reject cancelled workflow
        if: cancelled()
        run: exit 1
