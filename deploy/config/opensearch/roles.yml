---
_meta:
  type: roles
  config_version: 2

# Fess has to create aliases, templates, pipelines and its own indices. Cluster
# operations are broad, while index access remains restricted to Fess prefixes.
# A narrower action trace is a required gate before promoting this catalog.
fess_backend:
  reserved: false
  hidden: false
  cluster_permissions:
    - cluster_all
    # OpenSearch Security evaluates the top-level Bulk API action as a cluster
    # permission even when every operation targets an index allowed below.
    # ConfigSync uses that API to persist Fess analyzer dictionaries.
    - "indices:data/write/bulk"
    # ConfigSync then reads those records through a scroll and explicitly
    # clears it. OpenSearch Security also evaluates these composite actions at
    # the cluster layer; the target index remains constrained below.
    - "indices:data/read/scroll"
    - "indices:data/read/scroll/clear"
  index_permissions:
    - index_patterns:
        - "fess*"
        - ".fess*"
      allowed_actions:
        - indices_all
    # ConfigSync 3.8 stores Fess analyzer dictionaries in the exact regular
    # index configured by configsync.index. Its legacy migration source is
    # .configsync; this new catalog deliberately receives no access to that or
    # to any other dot-prefixed OpenSearch index.
    - index_patterns:
        - "configsync"
      allowed_actions:
        - indices_all
