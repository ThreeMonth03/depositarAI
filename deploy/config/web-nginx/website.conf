server {
    listen 8080;
    root /app/web-dist;
    index index.html;
    autoindex off;
    disable_symlinks on;
    absolute_redirect off;
    include /etc/nginx/intranet-allow.conf;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 130s;
    proxy_buffering off;

    location = /healthz { proxy_pass http://website; }
    location /api/ { proxy_pass http://website; }
    location /v1/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($http_content_length !~ ^(0|)$) { return 400; }
        if ($http_transfer_encoding != "") { return 400; }
        try_files $uri $uri/ =404;
    }
}
