worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    # No IP, query text, session token, URL arguments or Authorization in logs.
    log_format safe '$request_id $request_method $status $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 4k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 5s;
    send_timeout 10s;
    resolver 127.0.0.11 ipv6=off valid=10s;
    upstream website {
        zone website 64k;
        server web:8000 resolve;
        keepalive 4;
    }
    limit_req_zone $binary_remote_addr zone=web_rate:1m rate=3r/s;
    server {
        listen 8080;
        limit_req zone=web_rate burst=12 nodelay;
        limit_req_status 429;
        location / {
            proxy_pass http://website;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 130s;
            proxy_buffering off;
        }
        # Never expose the GPU API or an arbitrary proxy through this website.
        location /v1/ { return 404; }
    }
}
