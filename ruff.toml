# Shared policy for the Ruff version pinned in requirements-test.lock.
line-length = 79
indent-width = 4

[lint]
select = ["E4", "E7", "E9", "F", "E501"]

[lint.mccabe]
max-complexity = 10

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
