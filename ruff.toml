# Preserve the baseline used by the pinned Ruff in requirements-test.lock.
line-length = 88
indent-width = 4

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.mccabe]
max-complexity = 10

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
